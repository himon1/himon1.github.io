<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Mu Hao</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('hm-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="hero" style="min-height:100svh; padding-top: var(--header-h);">
    <div class="wrap">
      <p class="eyebrow"><span class="pulse-dot" aria-hidden="true"></span>404 · Lost in the index</p>
      <h1 class="hero-title" style="font-size: clamp(4rem, 12vw, 9rem);">404</h1>
      <p class="hero-lede" style="margin-top:24px;">This page is not in the index. The homepage is.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="./">Return home <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </main>
</body>
</html>
